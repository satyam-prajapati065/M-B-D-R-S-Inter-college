<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Tilt Event Card</title>
    <style>
      /* CSS Styles */
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #e0e0e0;
        font-family: "Poppins", sans-serif;
      }

      .container {
        perspective: 1000px; /* 3D effect ke liye zaroori hai */
      }

      .tilt-card {
        width: 300px;
        height: 400px;
        background: #fff;
        border-radius: 15px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.1s ease; /* Smooth movement */
        box-shadow: 0 20px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      /* Image Section */
      .card-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("https://images.unsplash.com/photo-1546410531-bb4caa6b424d?auto=format&fit=crop&q=80&w=1000");
        background-size: cover;
        background-position: center;
        transition: transform 0.5s ease;
      }

      /* Overlay Text */
      .card-info {
        position: relative;
        padding: 20px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
        color: white;
        transform: translateZ(
          50px
        ); /* Text ko 3D look dene ke liye upar uthata hai */
      }

      .card-info h2 {
        margin: 0;
        font-size: 22px;
        text-transform: uppercase;
      }

      .card-info p {
        font-size: 14px;
        opacity: 0.8;
        margin-top: 5px;
      }

      .date-badge {
        position: absolute;
        top: 20px;
        right: 20px;
        background: #ffcc00;
        color: #000;
        padding: 5px 12px;
        border-radius: 5px;
        font-weight: bold;
        font-size: 12px;
        transform: translateZ(30px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="tilt-card" id="card">
        <div class="card-image"></div>
        <div class="date-badge">15 APR</div>
        <div class="card-info">
          <h2>Annual Function</h2>
          <p>Join us for the cultural celebration 2026.</p>
        </div>
      </div>
    </div>

    <script>
      const card = document.getElementById("card");

      // Mouse Move Event
      card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();

        // Mouse ki position calculate karna (relative to card)
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Card ka center point
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        // Tilt angle calculate karna (Max 20 degree tilt)
        const rotateX = ((y - centerY) / centerY) * -20;
        const rotateY = ((x - centerX) / centerX) * 20;

        // Transform apply karna
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      });

      // Mouse Leave Event (Wapas position par lane ke liye)
      card.addEventListener("mouseleave", () => {
        card.style.transform = `rotateX(0deg) rotateY(0deg)`;
        card.style.transition = "transform 0.5s ease"; // Smooth snap back
      });

      // Mouse Enter par transition hatana (Real-time tracking ke liye)
      card.addEventListener("mouseenter", () => {
        card.style.transition = "none";
      });
    </script>
  </body>
</html>
